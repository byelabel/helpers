name: publish

on:
  push:
    tags:
      - 'utils-v*'
      - 'react-v*'
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        options:
          - utils
          - react

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@byelabel'
          cache: pnpm

      - run: pnpm install
      - run: pnpm -r build
      - run: pnpm -r test

      # npmjs.com publishes use Trusted Publishing (OIDC).
      # No NPM_TOKEN — auth is brokered via the id-token written for this job.
      # Requires a trusted publisher registered on npmjs.com for each package
      # pointing at: repo=byelabel/helpers, workflow=publish.yml.
      - name: Publish @byelabel/utils to npmjs.com
        if: startsWith(github.ref, 'refs/tags/utils-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'utils')
        working-directory: packages/utils
        run: pnpm publish --access public --provenance --no-git-checks

      - name: Publish @byelabel/react to npmjs.com
        if: startsWith(github.ref, 'refs/tags/react-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'react')
        working-directory: packages/react
        run: pnpm publish --access public --provenance --no-git-checks

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@byelabel'

      - name: Publish @byelabel/utils to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/utils-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'utils')
        working-directory: packages/utils
        run: pnpm publish --access public --no-git-checks --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @byelabel/react to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/react-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'react')
        working-directory: packages/react
        run: pnpm publish --access public --no-git-checks --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find previous tag for this package
        if: startsWith(github.ref, 'refs/tags/')
        id: prev
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREFIX="${TAG%-v*}-v"
          PREV=$(git tag --list "${PREFIX}*" --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
          echo "previous_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-<none>}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          previous_tag: ${{ steps.prev.outputs.previous_tag }}
