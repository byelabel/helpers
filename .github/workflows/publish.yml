name: publish

on:
  push:
    tags:
      - 'utils-v*'
      - 'react-v*'
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        options:
          - utils
          - react

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@byelabel'
          cache: pnpm

      - run: pnpm install
      - run: pnpm -r build
      - run: pnpm -r test

      - name: Publish @byelabel/utils
        if: startsWith(github.ref, 'refs/tags/utils-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'utils')
        working-directory: packages/utils
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @byelabel/react
        if: startsWith(github.ref, 'refs/tags/react-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'react')
        working-directory: packages/react
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@byelabel'

      - name: Publish @byelabel/utils to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/utils-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'utils')
        working-directory: packages/utils
        run: pnpm publish --access public --no-git-checks --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @byelabel/react to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/react-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'react')
        working-directory: packages/react
        run: pnpm publish --access public --no-git-checks --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find previous tag for this package
        if: startsWith(github.ref, 'refs/tags/')
        id: prev
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREFIX="${TAG%-v*}-v"
          PREV=$(git tag --list "${PREFIX}*" --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
          echo "previous_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-<none>}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          previous_tag: ${{ steps.prev.outputs.previous_tag }}
